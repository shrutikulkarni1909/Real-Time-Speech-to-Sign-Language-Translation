<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Speech → Gloss → Sign Video</title>

  <style>
    body { margin: 0; font-family: Arial; background: #f7f5f5; color: white; text-align: center; }

    #panel {
      position: fixed;
      top: 90px;
      left: 580px;
      background: white;
      color: black;
      padding: 12px;
      border-radius: 10px;
      width: 360px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    button { width: 100%; padding: 10px; margin-top: 8px; font-size: 15px; }
    #spoken, #gloss { margin-top: 6px; font-size: 14px; }
    #gloss { font-weight: bold; color: #000000; }

    video {
      margin-top: 300px;
      width: 520px;
      max-width: 95vw;
      border-radius: 12px;
      background: black;
      box-shadow: 0 0 16px rgba(0,0,0,0.6);
    }
  </style>
</head>

<body>

<div id="panel">
  <b>🎤 Speech → Gloss → Sign Video</b>
  <button onclick="startSpeech()">Start Speaking</button>
  <div id="spoken">Text: ---</div>
  <div id="gloss">Gloss: ---</div>
</div>

<video id="signVideo" controls autoplay muted playsinline></video>

<script src="avatar.js"></script>
</body>
</html>
